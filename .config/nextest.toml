# cargo-nextest (https://nexte.st), the one test runner (owner ruling 144):
# `just test`, `test-staged`, `test-pkg` (gates/gates.just `_tests`) and the
# mutation run (.cargo/mutants.toml `test_tool = "nextest"`) all read this
# file. Each test runs in a process of its own
# (https://nexte.st/docs/design/why-process-per-test/).

# The version this file is written for: setup scripts as configured below.
nextest-version = { required = "0.9.98", recommended = "0.9.146" }

# Setup scripts are experimental in nextest
# (https://nexte.st/docs/configuration/setup-scripts/); they are nextest's
# documented way to do work once per run and hand its result to the tests.
experimental = ["setup-scripts"]

# Build the programs the `ctxloom` package's acceptance tests run, once per
# run, and name them to the tests (CTXLOOM_TEST_BINARY,
# CTXLOOM_TEST_COMPANION_STUB). Without it each test process built them
# itself: about 2.3 s of cargo per test, 406 tests in about 57-80 s. A cold
# build takes minutes, so the script is only reported slow, never killed.
[scripts.setup.build-binaries]
command = 'scripts/nextest-build-binaries.sh'
slow-timeout = { period = "120s" }
leak-timeout = { period = "1s", result = "fail" }
capture-stdout = true
capture-stderr = true

# Windows runs no `.sh` itself: there the same script is run by Git for
# Windows' `sh` (bash; `sh`, not `bash`, because a Windows program finds
# `bash` in System32, WSL's launcher, before it searches PATH).
[scripts.setup.build-binaries-windows]
command = ['sh', 'scripts/nextest-build-binaries.sh']
slow-timeout = { period = "120s" }
leak-timeout = { period = "1s", result = "fail" }
capture-stdout = true
capture-stderr = true

# Every test runs with no home of the shell it was started in (OD-34): the
# owner's and every agent's shell carries CTXLOOM_HOME (which ctxloom reads
# before HOME) and an engine's relocated CLAUDE_CONFIG_DIR, OPENCODE_CONFIG_DIR
# and XDG bases, and a test that kept one once registered 85 temporary
# projects in the owner's real ctxloom home. The script names each as a file
# under which nothing can be created, so such a test fails instead. Here and
# not in the justfile: every test gate (test, test-pkg, test-staged) and the
# mutation run go through nextest and this file.
[scripts.setup.guard-homes]
command = 'scripts/nextest-guard-homes.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.guard-homes-windows]
command = ['sh', 'scripts/nextest-guard-homes.sh']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
setup = 'guard-homes'

[[profile.default.scripts]]
platform = 'cfg(windows)'
filter = 'all()'
setup = 'guard-homes-windows'

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'package(ctxloom)'
setup = 'build-binaries'

[[profile.default.scripts]]
platform = 'cfg(windows)'
filter = 'package(ctxloom)'
setup = 'build-binaries-windows'

[profile.default]
# Retries stay OFF (ruling 144): a retry passes a flaky test ("treated as
# ultimately successful", https://nexte.st/docs/features/retries/), which
# would have hidden the port race of ad31aa071. A flake is a finding.
retries = 0

# A test is SLOW after 30 s and terminated after 4 periods, 120 s
# (https://nexte.st/docs/features/slow-tests/). Measured on 2026-11-11 (the
# whole workspace, 3,853 tests, 20 cores): the longest test took 5.0 s
# (the feature runner, then one test; its clusters now have limits of their
# own, below), then 3.1 s (companion_assembly, hook-listener's held
# connection); every other under 2.3 s. 30 s is six
# times the longest, room for a loaded machine or a mutant; a test past 120 s
# is hung, and once hung the pre-commit hook until a person intervened. Its
# process group is sent SIGTERM, then SIGKILL after the grace.
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "10s" }

# A test that returns while a child it started still holds its stdout or
# stderr fails (https://nexte.st/docs/features/leaky-tests/); only children
# that inherit them are seen (run-within pipes its programs' output).
leak-timeout = { period = "200ms", result = "fail" }

# The tests that bind a TCP port in the test process, or bind one, free it
# and dial it expecting nobody there (`closed_url`, `closed_endpoint`), run
# one at a time across every test binary: ports are system-wide, and another
# test's port-0 bind taking the freed port was the race of ad31aa071
# (https://nexte.st/docs/configuration/test-groups/). The feature runner's
# clusters are not among them: the daemons and listeners their scenarios
# start bind port 0 in ctxloom's own processes and are told the port, and no
# scenario dials a port it freed, so they share no port and run at once.
[test-groups]
ports = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
    package(hook-listener)
    | package(hook-sink-grpc)
    | package(daemon-client)
    | package(daemon-api-grpc)
    | package(forge-github)
    | (package(ctxloom-wiring) & test(/^capture::tests::/))
    | (package(ctxloom) & test(/^tests::hook::/))
'''
test-group = 'ports'

# The feature runner's clusters (owner ruling of 2026-11-14): the features
# run as one test per cluster of feature files
# (`tests::gherkin_features::clusters::<name>`, gherkin_features.test.rs's
# CLUSTERS), which nextest runs at once, each with a limit of its own, set
# here by an override naming it. Every other test keeps the 120 s above.
# Not a gate tuned until it passes: each limit is about 2.4 times the
# longest run of its cluster measured on 2026-11-14 (20 cores, the host
# shared with other agents' builds and tests, load average 20 to 41),
# rounded up to whole slow periods, and at least 60 s. A cluster's features
# run at once, so it takes at least as long as its slowest feature, whose
# scenarios take turns: `daemon` is cli/daemon.feature's 100 s or so, its
# daemons' idle times waited out in turn. Seconds, as measured: alone (the
# clusters only, `just ratchet-base`), beside the binary's other 500 tests
# (`just test-pkg ctxloom`, twice), and beside 2,500 tests of 12 crates:
#
#   cluster    alone   package       12 crates   longest   limit
#   daemon     123.1   118.5 103.1   105.4       123.1     300 (60 s x 5)
#   journeys    49.5    50.7  42.2    32.8        50.7     150 (30 s x 5)
#   library     28.4    30.6  28.7    20.3        30.6      90 (30 s x 3)
#   remotes     16.5    18.6  19.8    12.6        19.8      60 (30 s x 2)
#   setup       14.2    15.9  16.3    10.1        16.3      60 (30 s x 2)
#   sessions    12.8    14.8  14.8    10.4        14.8      60 (30 s x 2)
#   other        4.0     4.0   5.2     3.6         5.2      60 (30 s x 2)
#
# In the whole workspace (5,070 tests, the commit gate's run), `daemon` took
# 114.9 s and `journeys` 47.5 s, and the others passed within their limits
# (a pass's time is not shown). Measured with 3 features of a cluster at
# once (the 20 cores shared among the 7 clusters); a host of fewer cores
# runs 2 at once and was not measured. A cluster past its limit is hung, as
# any test past 120 s is.
[[profile.default.overrides]]
filter = 'package(ctxloom) & test(=tests::gherkin_features::clusters::daemon)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }

[[profile.default.overrides]]
filter = 'package(ctxloom) & test(=tests::gherkin_features::clusters::journeys)'
slow-timeout = { period = "30s", terminate-after = 5, grace-period = "10s" }

[[profile.default.overrides]]
filter = 'package(ctxloom) & test(=tests::gherkin_features::clusters::library)'
slow-timeout = { period = "30s", terminate-after = 3, grace-period = "10s" }

[[profile.default.overrides]]
filter = '''
    package(ctxloom) & (
        test(=tests::gherkin_features::clusters::remotes)
        | test(=tests::gherkin_features::clusters::setup)
        | test(=tests::gherkin_features::clusters::sessions)
        | test(=tests::gherkin_features::clusters::other)
    )
'''
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "10s" }

# The Windows and macOS subset CI runs on a branch push (owner ruling
# 2026-11-12; ci.yml sets NEXTEST_PROFILE=ci-platform there, `default` on
# main, pull requests, tags and the nightly). It inherits everything above
# (the setup scripts, the `ports` group, the timeouts) and narrows what runs
# to the tests that touch the platform: every workspace crate that depends,
# however far, on a workspace crate that uses the platform seams (os,
# file-system, run-within: nextest's `rdeps()` names workspace packages only,
# so the seams' direct users are listed, and
# scripts/ci-platform-check.sh, run by CI's Linux job, fails when one is
# missing), the OS-specific tests by name (`::os::` modules; none are named
# so yet, so that term selects nothing until they are moved), and the core
# crates whose path handling Windows has broken before.
# `--ignore-default-filter` runs them all. `just test` stays the full suite
# everywhere: the default profile has no filter.
[profile.ci-platform]
default-filter = '''
    rdeps(cache-files)
    | rdeps(companion-probe)
    | rdeps(config-files)
    | rdeps(container-runtime)
    | rdeps(content-fs)
    | rdeps(ctxloom)
    | rdeps(ctxloom-store-sqlite)
    | rdeps(ctxloom-wiring)
    | rdeps(deps-files)
    | rdeps(editor-process)
    | rdeps(engine-claude)
    | rdeps(engine-opencode)
    | rdeps(fact-spool)
    | rdeps(git-cli)
    | rdeps(host-launcher)
    | rdeps(library-git)
    | rdeps(liveness)
    | rdeps(remote-git)
    | rdeps(session-files)
    | rdeps(stub-companion)
    | rdeps(surface-files)
    | rdeps(taskloom-cli-client)
    | rdeps(worktree-git)
    | test(/::os::/)
    | package(run-ports)
    | package(setup-application)
    | package(reclaim-application)
    | package(library-application)
    | package(run-application)
    | package(run-launcher)
'''
