// A finding of a run's plan (doctor's words: what is wrong and what to do).
message Finding {
  // What it is about.
  string kind = 1;
  // What was found.
  string text = 2;
  // What to do about it.
  string remedy = 3;
  // It aborts the launch (exit 21).
  bool fatal = 4;
}

// A run: its plan, and once created its session and (TERMINAL) its launch.
message Run {
  option (google.api.resource) = {
    type: "ctxloom.dev/Run"
    pattern: "projects/{project}/runs/{run}"
    singular: "run"
    plural: "runs"
  };

  // How a run is started.
  enum Mode {
    // Unset: a CreateRun naming none is answered UNIMPLEMENTED.
    MODE_UNSPECIFIED = 0;
    // `run --one-shot`: hosted by the daemon, its reply streamed back.
    ONE_SHOT = 1;
    // `run`: the interactive TUI, started by the frontend from the run's
    // `launch`.
    TERMINAL = 2;
  }

  // `projects/{project}/runs/{run}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // How it is started.
  Mode mode = 2;
  // `projects/{project}/sessions/{session}`.
  string session = 3;
  // The agent it was planned for, as asked.
  string agent = 4;
  // The Engine it runs on, by its resource name.
  string engine = 5;
  // The profiles its context composes.
  repeated string profiles = 6;
  // The context its engine is given.
  string context = 7;
  // The context's token estimate: a count, so a JSON number (OQ-12).
  uint32 tokens = 8;
  // Its plan's findings; a fatal one aborts it.
  repeated Finding findings = 9;
  // The agent's settings on the run's engine, each with the layer that said
  // it (ruling 72; library.proto's), so `settings.model.value` keeps its
  // path; none for a run with no agent (design §5.9, OD-40: it replaced the
  // draft's flat `repeated Setting`).
  AgentSettings settings = 10;
  // TERMINAL only: what the frontend starts.
  Launch launch = 11;
  // The runner bearer (deleted, slice 2: one principal, the user).
  reserved 12;
  reserved "runner_bearer";
  // The workspace axis the run asks for (`--workspace`); empty, none asked
  // (Go's dry run's top-level `workspace`). What it settles on is
  // `settled_workspace`.
  string workspace = 13;
  // The runtime the run's agent declares; empty, none (Go's dry run's
  // top-level `runtime`). What it settles on is `settled_runtime`.
  string runtime = 14;
  // The opening prompt, as the plan resolved it.
  string prompt = 15;
  // The fragments the context composes, by canonical reference.
  repeated string fragments = 16;
  // A one-shot that ended before the daemon hosted it (U4: its plan, its
  // resume or its enqueue refused, or its session not made): its end, said
  // as `WatchRun` would have said it. Its `name` is `<parent>/runs/-`, as
  // nothing is left to watch.
  RunEnd end = 17;
  // The agent `settings` are of (step 10a U2, owner ruling 2026-11-17): the
  // one asked, or the default agent a run with no `--agent` takes; empty
  // with no settings. The dry run's Settings section names its places by
  // it (`agents.<agent>.engines.<engine>`).
  string settings_agent = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The workspace axis the launch settles on (step 10a U2, owner ruling
  // 2026-11-17: the dry run prints it beside the agent): the one asked, else
  // the config's `workspace`, else `none`.
  string settled_workspace = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The runtime the launch settles on: the agent's, else the config's
  // `runtime`, else `host`.
  string settled_runtime = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // On a preview, the needs a person must answer before the apply.
  repeated Need needs = 90;
  // On a preview, the etag of what it was planned against, for the apply to
  // send back.
  string etag = 91 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What is said beside the run, each notice its code, args and text.
  repeated Notice notices = 92;
}

// `run [--one-shot] [--dry-run]`: a run planned in the client's directory and
// environment.
message CreateRunRequest {
  // The parent to create the Run under.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Run"];
  // ONE_SHOT or TERMINAL; unspecified is answered UNIMPLEMENTED.
  Run.Mode mode = 2 [(google.api.field_behavior) = REQUIRED];
  // The opening prompt; a ONE_SHOT without one is refused `runs-no-prompt`.
  string prompt = 3 [(google.api.field_behavior) = OPTIONAL];
  // The agent to plan for (`--agent`); empty, the default agent.
  string agent = 4 [(google.api.field_behavior) = OPTIONAL];
  // The engine to run on (`--engine`); empty, the agent's own.
  string engine = 5 [(google.api.field_behavior) = OPTIONAL];
  // The profile to compose instead of the agent's (`--profile`): only the
  // first is planned today.
  repeated string profiles = 6 [(google.api.field_behavior) = OPTIONAL];
  // `run --session <harp>`: resume.
  string session = 7 [(google.api.field_behavior) = OPTIONAL];
  // What else the line selects the context by (U4: the whole of
  // `RunRequest`, so the daemon plans the run the command asked for).
  repeated string fragments = 8 [(google.api.field_behavior) = OPTIONAL];
  // The tags whose fragments the context loads.
  repeated string tags = 9 [(google.api.field_behavior) = OPTIONAL];
  // `--command`: a saved command, its text the prompt.
  string command = 10 [(google.api.field_behavior) = OPTIONAL];
  // The workspace axis (`--workspace`): `none` or a checkout; empty, the
  // config's.
  string workspace = 11 [(google.api.field_behavior) = OPTIONAL];
  // `--no-context`.
  bool no_context = 12 [(google.api.field_behavior) = OPTIONAL];
  // The client's working directory: where the run is planned from, as a
  // process there would plan it (with `env`).
  string cwd = 13 [(google.api.field_behavior) = OPTIONAL];
  // A TERMINAL run's own lock (its launcher lock, `RunEnqueued.
  // launcher_lock`), which the frontend took BEFORE it asked and holds
  // until its start report is recorded (U5's start-report race, owner
  // 2026-11-14): `<home>/.ctxloom/runs/<request id>.lock`. The daemon
  // journals it instead of a lock of its own when it reads held, so a
  // daemon started in the gap reads the run's owner alive. Empty: the
  // daemon holds its own, as before.
  string launcher_lock = 14 [(google.api.field_behavior) = OPTIONAL];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // The dry run (`run --dry-run`, AIP-163): not served by the daemon yet
  // (answered UNIMPLEMENTED); the command plans it itself.
  bool validate_only = 92 [(google.api.field_behavior) = OPTIONAL];
  // One answer to each need the preview asked (needs.proto); an apply that
  // leaves one unanswered is refused `NeedsUnanswered`.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a write's answers to the needs its preview asked are ctxloom's (S38, API Q2). --)
  repeated Answer answers = 93 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
  // What the caller can present of a need: ask a person, or put a program on
  // their terminal.
  Presentable presentable = 95 [(google.api.field_behavior) = OPTIONAL];
  // The global flags (`--degraded`, `--no-companions`, `--config-set`) the
  // call is planned under.
  Globals globals = 96 [(google.api.field_behavior) = OPTIONAL];
}

// A run by its name.
message GetRunRequest {
  // The Run to read, by its resource name.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Run"];
}

// `WatchRun`: a hosted run's events, from its first.
message WatchRunRequest {
  // The Run to watch, `projects/{project}/runs/{run}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// A one-shot's end. Stopped by `RequestStop`: exit 128 plus the signal's
// number, `run-application-stopped`. A run that answered ends with exit 0
// and no code. `args` are the diagnostic's, flattened as angzarr flattens a
// cause on its wire (a wrapped cause is its code under the arg's name, and
// each of its own args under `<name>.<arg>`), so a client renders the text
// itself; `text` is the end as a log line says it (its code and args,
// never English: decision 14.37).
message RunEnd {
  // The command's exit code.
  int32 exit = 1;
  // The diagnostic's code; empty for a run that answered.
  string code = 2;
  // The diagnostic's args, flattened.
  repeated NeedArg args = 3;
  // The end as a log line says it: its code and args.
  string text = 4;
  // An aggregate refusal's refusals, in check order (rulings 73b, 73i),
  // each said as the run's single refusal would be.
  repeated RunEnd refusals = 5;
}

// The daemon is stopping the run's engine (s4-Q2): a one-shot's, asked by
// `RequestStop` (its tree asked to stop, then killed after `grace_ms`); a
// TERMINAL run's frontend is told to stop its TUI (U5).
message RunStop {
  // Why it is stopped (the signal's name).
  string reason = 1;
  // The grace before it is killed, in milliseconds.
  uint32 grace_ms = 2;
}

// One event of a run, as `WatchRun` streams it.
message RunEvent {
  oneof event {
    // A notice the run said.
    Notice notice = 1;
    // The one-shot's reply.
    string reply = 2;
    // The run's end: the last event.
    RunEnd end = 3;
    // The daemon is stopping the run's engine.
    RunStop stop = 4;
  }
}

