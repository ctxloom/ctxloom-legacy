message DeleteHandOffRequest {
  // `projects/{project}/handOffs/{child}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/HandOff"];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
}

// The hand-off, by name only: its content never leaves the daemon.
message HandOff {
  option (google.api.resource) = {
    type: "ctxloom.dev/HandOff"
    pattern: "projects/{project}/handOffs/{hand_off}"
    singular: "handOff"
    plural: "handOffs"
  };

