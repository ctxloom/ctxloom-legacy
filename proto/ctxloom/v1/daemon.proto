syntax = "proto3";

// DRAFT for the owner's review (ruling 132, design-by-test), compiled by
// daemon-proto (its messages, each refusal's status, and the `Ctxloom`
// service's stubs). Served so far (slice 2 steps 5, 6): GetDaemon, StopDaemon,
// ResolveProject, GetProject, GetSession, ListSessions, SearchSessions, and
// in a `session-destroy` build DeleteSession and SweepSessions; slice 3 adds
// GetTranscript and AssembleContext (its fragments and tags); slice 4 adds
// CreateHandOff and DeleteHandOff (a child's launch, U3), CreateRun for a
// ONE_SHOT run, GetRun and WatchRun (U4), and CreateRun for a TERMINAL run,
// answered with its launch (U5); step 8 U1 adds GetTrust and ListTrusts, and
// U4 CreateApproval, GetApproval, ListApprovals and WaitApproval; every
// other method answers UNIMPLEMENTED.
//
// THE USER'S DAEMON'S API (T1-T30; the owner's API rulings Q1-Q13; rulings
// 146, 147). It MIRRORS THE COMMAND LINE (T22): the CLI's nouns are AIP
// resources (AIP-121, 122) and its verbs their standard methods (AIP-131
// Get, 132 List, 133 Create, 134 Update, 135 Delete) or custom methods
// (AIP-136). It is ONE service, `Ctxloom`, below.
//
// DOMAIN WRITES ARE NOT HERE (T16, S1 amended). A write to the store is a
// ctxloom command or fact proto sent through angzarr's own coordinator,
// `io.angzarr.transport.distributed.v1.CommandHandlerCoordinatorService`
// (`HandleSync` when the client renders the result, else `Handle`), never
// wrapped in a method here. Its id is the command id the client chose
// (`CommandPage.command_id`), so the one retry on a respawned daemon (S8)
// is a DUPLICATE. S21 and S41 (owner, reconciled): this service's messages
// carry the client's INTENT only, never evidence; a domain command sent
// through `Handle` keeps its evidence fields, which the daemon's gate
// STAMPS on admission, overwriting whatever the client put there.
//
//   the CLI verb                          the command               HandleSync waits for
//   session rename <harp> <title>         sessions.SetSessionTitle  session-index
//                                         (new with the rework: harps are
//                                         permanent, S42; RenameSession goes)
//   session keep <harp> [--undo]          sessions.SetKept          session-index
//   session send <harp> <urgency> <text>  sessions.SendMessage      pending-messages
//   session clear <harp>                  sessions.ClearChild       session-index
//   session close <harp>                  sessions.CloseSession     session-index
//   session stop <harp> (not built)       runs.RequestStop          (Handle)
//                                         (the session's current run; no
//                                         latch, owner 2026-11-15)
//   session launch <owner> ...            sessions.LaunchChild      session-index
//                                         (after CreateHandOff)
//   session approvals answer <ask> <opt>  approvals.AnswerApproval  pending-approvals
//   trust                                 trust.GrantTrust          trust-index
//   trust --undo                          trust.RevokeTrust         trust-index
//   a one-shot's signal (API Q11)         runs.RequestStop          (Handle)
//   the frontend's TUI start and exit     runs.RecordRunnerStarted, (Handle, facts)
//                                         RecordRunExited, RecordLaunchFailed
//   a hook                                the capture facts         (Handle, facts)
//   the daemon, an opencode ask (ACP)     approvals.RecordApprovalAsked (in process, fact)
//   `mcp serve`, a cancelled claude ask   approvals.RecordApprovalWithdrawn (Handle, fact)
// claude's ask is not a domain write of the client's: `mcp serve` calls
// `CreateApproval` (below), and the daemon records `RecordApprovalAsked`
// with what only it knows (D10).
// A remove is a sequence the daemon runs (`DeleteSession` below: its
// worktrees, then its streams purged, then its directory and lock; T28's
// trash step is not built), as `bundle import --force` is to be (the old
// bundle to trash, then the new one in; S52). A
// `HandleSync` projection IS the resource message the matching `Get` returns
// (one renderer per resource).
//
// WHAT GOES WITH THEM (T16, s4-Q2): a run's client follows it with
// `WatchRun` (daemon-folded, S44; its `stop` event tells a frontend to stop
// its TUI), and a frontend holds the session lock; liveness is
// `grpc.health.v1.Health`. There is no hold stream and no routing: one
// per-user store (T14), so a stream reference is its root alone.
//
// CREDENTIALS (T15, the separation model of slice 2). One principal, the
// user. One TCP+TLS listener, its certificate the discovery file's; every
// caller (the CLI, a hook, the MCP server) presents the USER bearer and pins
// the certificate. The bearer and the pinned certificate keep non-user
// callers off the socket (other users, web pages, containers, machines);
// nothing separates the user's own processes, which can all read the
// discovery file. A command addresses its target session once, as its
// Cover's root, and names its `requester` in a field of its own, set by the
// client and taken as sent (an address, never an identity). No run is sent,
// and the daemon checks no session against a run.
//
// THE AIP FIELDS, AT FIXED NUMBERS IN EVERY REQUEST (API Q13):
//   1        `name` (or `parent`)
//   2..79    the resource's own fields
//   80, 81   `page_size`, `page_token` (AIP-158; every List); 80
//            `next_page_token` in every List response
//   90       `request_id` (AIP-155; every write): the client's id, sent
//            again unchanged on the one retry; a retry that already
//            applied returns the first response
//   91       `etag` (AIP-154; every confirmed write): what the preview was
//            planned against; stale is `PlanStale`
//   92       `validate_only` (AIP-163; every write): the preview, returning
//            the `needs` (needs.proto) the apply then answers
//   93       `answers`
//   94       `env`: the caller's WHOLE environment, where the call needs it
//            (S7), held in memory for the call's life
//   95       `presentable`
//   96       `globals` (--degraded, --config-set, --no-companions)
// and in every write response: 90 `needs`, 91 `etag`, 92 `notices`.
//
// JSON (ruling 146): `--format json` prints the response message's proto3
// JSON, snake_case field names (`preserving_proto_field_names`).
//
// LINT (ruling 147; S36, S37, S57 owner; D6): googleapis' annotation,
// client and longrunning protos are vendored into
// `proto/third_party/google/` at one pinned commit, each checked against
// its SHA-256 (`SHA256SUMS`, `scripts/vendor-googleapis.sh`, Apache-2.0),
// and api-linter, a pinned release checked by SHA-256, lints these drafts
// (`just lint-api`, `proto/api-linter.yaml`). Each resource carries its
// `google.api.resource`, and its fields their `google.api.field_behavior`
// where the drafts settle it (step 10 U1). Every element has a comment of
// its own, and every field a request reaches its `field_behavior`, as the
// daemon treats it (REQUIRED only where it refuses the field's absence);
// region markers and notes that belong to no element are internal comments,
// `(-- region ... --)` (step 10 U1, its remainder). Departures are commented
// exceptions at their site: a write request's `answers` (needs are
// ctxloom's, API Q2, S38); `WatchTranscript` and `WatchRun` are
// daemon-folded streams (S44). Write responses carry `needs` (AIP-163
// returns the would-be response alone), S38 too.
//
// NAMES (S42, owner): user-addressable things are HARPS, minted once and
// never changed. A project is `projects/{project}` by ITS harp; a session
// `projects/{project}/sessions/{session}`, six words. The project id and a
// session's stream root are fields (`uid`).
//
// EXIT CODES (rulings 149, 152, 153): 0 ok (an apply or a preview); 1 a
// preview that would change something, only with `--detailed-exitcode`; 10
// failed; 20 refused (usage errors included); 21 fatal findings; 128+n a
// signal.
//
// REFUSALS (S11): a refused method is answered with the gRPC status its
// refusal message's `(refusal_status)` declares, the message packed in
// `google.rpc.Status.details`.
package ctxloom.v1;

import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/options.proto";
import "ctxloom/v1/launch.proto";
import "ctxloom/v1/library.proto";
import "ctxloom/v1/needs.proto";

// The user's daemon: ONE service, mirroring the command line (T22), its nouns
// resources and its verbs their methods.
service Ctxloom {
  // (-- region daemon: `daemon` (a singleton, AIP-156). With none serving, the
  // client answers `daemon status|stop` itself (S14). --)
  // `daemon status`: the daemon, what it hosts and its idle time; never its
  // bearer.
  rpc GetDaemon(GetDaemonRequest) returns (Daemon) {
    option (google.api.method_signature) = "name";
  }
  // `daemon stop`: refused `DaemonHosting` while it hosts live runs, unless
  // `even_if_live`, which ends the hosted engines cleanly first (S12), or
  // `drain` (`daemon stop --drain`, `ctxloom shutdown`, OD-54): it hands
  // what it hosts over to the next daemon (of its own version: one version
  // runs at a time, OD-62) within `drain_timeout_seconds`
  // (else its configured `daemon.drain_timeout`), refusing every NEW call
  // meanwhile (`DaemonDraining`), but serving calls on work it already
  // holds (OD-62 adjusted): GetDaemon, this, ResolveProject/GetProject,
  // WatchRun of a run it hosts, DeleteHandOff of a hand-off made before the
  // drain, and every approvals call (D6: CreateApproval, GetApproval,
  // ListApprovals, WaitApproval; an ask comes only from a session the
  // daemon already hosts), and exits once it hosts nothing. An ask left
  // waiting when the daemon goes is ended by its alarm under the next
  // daemon (D11).
  rpc StopDaemon(StopDaemonRequest) returns (Daemon);
  // (-- endregion --)

  // (-- region projects: `projects/{project}` (the project's harp) --)
  // The project of a directory (S6): names only, never routing (T14).
  rpc ResolveProject(ResolveProjectRequest) returns (Project);
  // A project by its resource name, from the daemon's warm index.
  rpc GetProject(GetProjectRequest) returns (Project) {
    option (google.api.method_signature) = "name";
  }
  // `init` (API Q7): the preview's need asks `output.dir`; the apply returns
  // a continuation (the setup session's launch, then the restart offer's
  // request to preview when it ends).
  rpc InitProject(InitProjectRequest) returns (InitProjectResponse);
  // `context assemble`: the context a run would get (T30: each distilled
  // form's digest checked at this use).
  rpc AssembleContext(AssembleContextRequest) returns (AssembledContext);
  // (-- endregion --)

  // (-- region sessions: `projects/{project}/sessions/{session}` (both harps);
  // `projects/-/sessions` lists every project's (`--all`, AIP-159) --)
  // `session show <harp>`: one session, with its pending messages.
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.method_signature) = "name";
  }
  // `session list`: a project's sessions (`projects/-`: every project's),
  // most recently started first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `session search <words>`: the sessions whose harp or title holds every
  // word, case-insensitively.
  rpc SearchSessions(SearchSessionsRequest) returns (ListSessionsResponse);
  // `session remove`: its worktrees classified, the whole refused (with its
  // plan) if one is unsafe, else the worktrees removed, then the destroy.
  // Served only in a `session-destroy` build (M5).
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `session sweep`: each session by the fixed table, its purges through
  // the same removal as `DeleteSession`. A `session-destroy` build's (M5).
  rpc SweepSessions(SweepSessionsRequest) returns (SweepSessionsResponse);
  // `session transcript show`; `transcript list` is `ListSessions` with
  // `has_transcript`.
  rpc GetTranscript(GetTranscriptRequest) returns (Transcript) {
    option (google.api.method_signature) = "name";
  }
  // `session transcript watch`: its lines as they are delivered.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: a daemon-folded stream of the resource's lines or events (S44). --)
  rpc WatchTranscript(WatchTranscriptRequest) returns (stream TranscriptLine);
  // `session worktrees`: a session's scratch checkouts.
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse) {
    option (google.api.method_signature) = "parent";
  }
  // A child's hand-off (T6, S10): `projects/{project}/handOffs/{child}`,
  // created before `LaunchChild`: the daemon checks the owner, plans the
  // child and judges its credential BEFORE it writes anything, so a refused
  // launch leaves nothing. Refused `DaemonHomeGone` once the daemon's home
  // is gone (owner, 2026-11-17).
  rpc CreateHandOff(CreateHandOffRequest) returns (HandOff) {
    option (google.api.method_signature) = "parent,hand_off_id";
  }
  // A hand-off withdrawn: the `LaunchChild` it was created for was refused.
  rpc DeleteHandOff(DeleteHandOffRequest) returns (HandOff) {
    option (google.api.method_signature) = "name";
  }
  // (-- endregion --)

  // (-- region runs: `projects/{project}/runs/{run}` --)
  // `run --dry-run` is `validate_only`; `run --one-shot` creates a hosted
  // run (then `WatchRun`); `run` creates a TERMINAL run, whose `Run` holds
  // the `Launch` the frontend starts. Refused `DaemonHomeGone` once the
  // daemon's home is gone (owner, 2026-11-17).
  rpc CreateRun(CreateRunRequest) returns (Run) {
    option (google.api.method_signature) = "parent";
  }
  // A run the daemon hosts (or keeps, ended), by its name.
  rpc GetRun(GetRunRequest) returns (Run) {
    option (google.api.method_signature) = "name";
  }
  // A one-shot's notices, reply and end.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: a daemon-folded stream of the resource's lines or events (S44). --)
  rpc WatchRun(WatchRunRequest) returns (stream RunEvent);
  // (-- endregion --)

  // (-- region approvals: `projects/{project}/approvals/{approval}`, the
  // approval's id `ask-<adjective>-<noun>` (D9, Q7) --)
  // The claude ask (D10, AIP-133): `ctxloom mcp serve` sends the engine's
  // request, and the daemon fills root, run, engine, timeout, the harp and
  // the options, then records `approvals.RecordApprovalAsked`. Idempotent on
  // (session, engine_request_id): a retry answers the same approval.
  rpc CreateApproval(CreateApprovalRequest) returns (Approval) {
    option (google.api.method_signature) = "parent";
  }
  // An approval by its name.
  rpc GetApproval(GetApprovalRequest) returns (Approval) {
    option (google.api.method_signature) = "name";
  }
  // `session approvals`: the asks under a project's root sessions, oldest
  // first.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // ctxloom's MCP approval tool waits here (S27): answered once the approval
  // is settled (answered, expired or withdrawn). The caller's deadline is
  // the approval's `expire_time` plus a margin, never `within`'s read
  // deadline.
  rpc WaitApproval(WaitApprovalRequest) returns (Approval);
  // (-- endregion --)

  // (-- region trusts: `projects/{project}/trust` (a singleton sub-resource,
  // AIP-156; D2, S58) --)
  // The preview of `trust`: what it allows, and the etag `GrantTrust` names.
  rpc GetTrust(GetTrustRequest) returns (Trust) {
    option (google.api.method_signature) = "name";
  }
  // The projects the user trusts now (no parent): a revoked trust is not
  // listed.
  rpc ListTrusts(ListTrustsRequest) returns (ListTrustsResponse);
  // (-- endregion --)

  // (-- THE LIBRARY (OD-40; its messages are library.proto's, which documents
  // the resource tree, the ID grammar and the conventions). Every write
  // answers a response of its own (OQ-9). --)

  // (-- region bundles: `projects/{project}/bundles/{bundle}` and the other
  // Bundle patterns (origin is in the name, OQ-4) --)
  // `bundle show` (FULL) and `bundle view` (CONTENT).
  rpc GetBundle(GetBundleRequest) returns (Bundle) {
    option (google.api.method_signature) = "name";
  }
  // `bundle list`.
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `bundle create`.
  rpc CreateBundle(CreateBundleRequest) returns (CreateBundleResponse);
  // `bundle edit`: ONE change per call (T29): `update_mask` names one path.
  rpc UpdateBundle(UpdateBundleRequest) returns (UpdateBundleResponse) {
    option (google.api.method_signature) = "bundle,update_mask";
  }
  // `bundle remove`.
  rpc DeleteBundle(DeleteBundleRequest) returns (DeleteBundleResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `bundle export`: the bundle's tree copied to a directory.
  rpc ExportBundle(ExportBundleRequest) returns (ExportBundleResponse);
  // `bundle import`: a bundle tree copied into the project.
  rpc ImportBundle(ImportBundleRequest) returns (ImportBundleResponse);
  // `bundle move`: a bundle to another parent.
  rpc MoveBundle(MoveBundleRequest) returns (MoveBundleResponse);
  // (-- endregion --)

  // (-- region fragments and commands: a Bundle + `/fragments/{fragment}`,
  // `/commands/{command}` --)
  // `fragment show`.
  rpc GetFragment(GetFragmentRequest) returns (Fragment) {
    option (google.api.method_signature) = "name";
  }
  // `fragment list`.
  rpc ListFragments(ListFragmentsRequest) returns (ListFragmentsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `fragment create`.
  rpc CreateFragment(CreateFragmentRequest) returns (CreateFragmentResponse);
  // `fragment edit`: writes the `.md` alone (T30); with no fields, the
  // preview's need is an `Edit` of the document.
  rpc UpdateFragment(UpdateFragmentRequest) returns (UpdateFragmentResponse) {
    option (google.api.method_signature) = "fragment,update_mask";
  }
  // `fragment remove`.
  rpc DeleteFragment(DeleteFragmentRequest) returns (DeleteFragmentResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `fragment distill`: the `.distilled.md` alone, recording the source's
  // digest (T30); `clear` removes it.
  rpc DistillFragment(DistillFragmentRequest) returns (DistillFragmentResponse);
  // `fragment draft-premise`: a premise drafted for a fragment.
  rpc DraftFragmentPremise(DraftFragmentPremiseRequest) returns (DraftFragmentPremiseResponse);
  // `fragment premises`: `projects/{project}/premiseIndex` (a singleton).
  rpc GetPremiseIndex(GetPremiseIndexRequest) returns (PremiseIndex) {
    option (google.api.method_signature) = "name";
  }
  // `command show`.
  rpc GetCommand(GetCommandRequest) returns (Command) {
    option (google.api.method_signature) = "name";
  }
  // `command list`.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `command create`.
  rpc CreateCommand(CreateCommandRequest) returns (CreateCommandResponse);
  // `command edit`: writes the `.md` alone (T30).
  rpc UpdateCommand(UpdateCommandRequest) returns (UpdateCommandResponse) {
    option (google.api.method_signature) = "command,update_mask";
  }
  // `command remove`.
  rpc DeleteCommand(DeleteCommandRequest) returns (DeleteCommandResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `command distill`: the `.distilled.md` alone, recording the source's
  // digest (T30); `clear` removes it.
  rpc DistillCommand(DistillCommandRequest) returns (DistillCommandResponse);
  // (-- endregion --)

  // (-- region skills: a Bundle + `/skills/{skill}` --)
  // `skill show`.
  rpc GetSkill(GetSkillRequest) returns (Skill) {
    option (google.api.method_signature) = "name";
  }
  // `skill list`.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `skill create`: its `SKILL.md` scaffolded.
  rpc CreateSkill(CreateSkillRequest) returns (CreateSkillResponse);
  // `skill remove`.
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `skill export`: the skill as one zip.
  rpc ExportSkill(ExportSkillRequest) returns (ExportSkillResponse);
  // `skill import`: a skill's zip unpacked into a bundle.
  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse);
  // (-- endregion --)

  // (-- region MCP servers: a Bundle + `/mcpServers/{mcp_server}` --)
  // `mcp server show <ref>`.
  rpc GetMcpServer(GetMcpServerRequest) returns (McpServer) {
    option (google.api.method_signature) = "name";
  }
  // `mcp server list`, and `mcp server show <short name>`.
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `mcp server set|edit` (`allow_missing`: create-on-update, AIP-134).
  rpc UpdateMcpServer(UpdateMcpServerRequest) returns (UpdateMcpServerResponse) {
    option (google.api.method_signature) = "mcp_server,update_mask";
  }
  // (-- endregion --)

  // (-- region profiles: a Bundle + `/profiles/{profile}` --)
  // `profile show`.
  rpc GetProfile(GetProfileRequest) returns (Profile) {
    option (google.api.method_signature) = "name";
  }
  // `profile list`.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `profile create`.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // `profile edit`.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.method_signature) = "profile,update_mask";
  }
  // `profile remove`.
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `profile export`: the profile's file copied to a directory.
  rpc ExportProfile(ExportProfileRequest) returns (ExportProfileResponse);
  // `profile import`: a profile's file copied into a bundle.
  rpc ImportProfile(ImportProfileRequest) returns (ImportProfileResponse);
  // (-- endregion --)

  // (-- region agents: `projects/{project}/agents/{agent}`, `users/me/agents/{agent}` --)
  // `agent show`: the binding and what it resolves to.
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.method_signature) = "name";
  }
  // `agent list`.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `agent create`.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  // `agent edit`: an engine swap that loses something is a preview without
  // `--yes`.
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {
    option (google.api.method_signature) = "agent,update_mask";
  }
  // `agent remove`.
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `agent default <agent>`.
  rpc SetDefaultAgent(SetDefaultAgentRequest) returns (SetDefaultAgentResponse);
  // (-- endregion --)

  // (-- region engines: `projects/{project}/engines/{engine}` (read-only) --)
  // `engine show`: one engine's settings and what each of its agents
  // resolves to.
  rpc GetEngine(GetEngineRequest) returns (Engine) {
    option (google.api.method_signature) = "name";
  }
  // `engine list`.
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse) {
    option (google.api.method_signature) = "parent";
  }
  // (-- endregion --)

  // (-- region companions: `projects/{project}/companions/{companion}` --)
  // `companion list`: each registered companion, its program, whether it is
  // on PATH and whether it is enabled.
  rpc ListCompanions(ListCompanionsRequest) returns (ListCompanionsResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `companion add`.
  rpc CreateCompanion(CreateCompanionRequest) returns (CreateCompanionResponse);
  // `companion remove`.
  rpc DeleteCompanion(DeleteCompanionRequest) returns (DeleteCompanionResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // AIP-136: a resource-based custom method answers the resource (OD-9).
  rpc EnableCompanion(EnableCompanionRequest) returns (Companion);
  // `companion disable`: it stays registered and contributes nothing.
  rpc DisableCompanion(DisableCompanionRequest) returns (Companion);
  // `loadout`: ctxloom's own loadout, what it contributes to a session as
  // its own companion (owner ruling 2026-11-17, step 10a U2).
  rpc GetLoadout(GetLoadoutRequest) returns (Loadout) {
    option (google.api.method_signature) = "name";
  }
  // (-- endregion --)

  // (-- region remotes: `projects/{project}/remotes/{remote}` --)
  // One remote's registration.
  rpc GetRemote(GetRemoteRequest) returns (Remote) {
    option (google.api.method_signature) = "name";
  }
  // `remote list`.
  rpc ListRemotes(ListRemotesRequest) returns (ListRemotesResponse) {
    option (google.api.method_signature) = "parent";
  }
  // `remote show`: what a remote publishes (its bundles), read from its
  // cached clone as `remote show` always read it (cloned first where none
  // is cached); nothing is installed (AIP-136, a resource-based custom
  // method, `:browse`; step 10a U2, owner ruling 2026-11-17).
  rpc BrowseRemote(BrowseRemoteRequest) returns (BrowseRemoteResponse) {
    option (google.api.method_signature) = "name";
  }
  // `remote create`.
  rpc CreateRemote(CreateRemoteRequest) returns (CreateRemoteResponse);
  // `remote edit`: one change per call.
  rpc UpdateRemote(UpdateRemoteRequest) returns (UpdateRemoteResponse) {
    option (google.api.method_signature) = "remote,update_mask";
  }
  // `remote remove`.
  rpc DeleteRemote(DeleteRemoteRequest) returns (DeleteRemoteResponse) {
    option (google.api.method_signature) = "name,etag";
  }
  // `remote default [r] [--clear]`.
  rpc SetDefaultRemote(SetDefaultRemoteRequest) returns (SetDefaultRemoteResponse);
  // (-- endregion --)

  // (-- region dependencies: `projects/{project}/dependencies/{dependency}` --)
  // `deps list`: the lock's entries.
  rpc ListDependencies(ListDependenciesRequest) returns (ListDependenciesResponse) {
    option (google.api.method_signature) = "parent";
  }
  // AIP-136: a resource-based custom method answers the resource.
  rpc HoldDependency(HoldDependencyRequest) returns (Dependency);
  // `deps unhold`, `deps hold --undo`: the dependency, released.
  rpc ReleaseDependency(ReleaseDependencyRequest) returns (Dependency);
  // (-- endregion --)

  // (-- region config: `projects/{project}/config`, `users/me/config` (singletons) --)
  // `config show [section] [--raw]`.
  rpc GetConfig(GetConfigRequest) returns (Config) {
    option (google.api.method_signature) = "name";
  }
  // `config set`: one key per call (T29).
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {
    option (google.api.method_signature) = "config,update_mask";
  }
  // `config create` (AIP-156 forbids Create on a singleton).
  rpc ScaffoldConfig(ScaffoldConfigRequest) returns (ScaffoldConfigResponse);
  // (-- endregion --)

  // `search`: `projects/{project}:searchLibrary` (AIP-136, stateless).
  rpc SearchLibrary(SearchLibraryRequest) returns (SearchLibraryResponse);

  // The rest of the CLI, drafted with the milestone that ports each, by
  // these rules (S33): hooks; remotes' DiscoverRemotes;
  // dependencies' PullDependencies, UpgradeDependencies, CheckDependencies,
  // ExplainDependency (B4's, their shapes on a ruling: library.proto's
  // closing note); PushBundle (T26
  // sequences; its response B4's); InstallManage, UninstallManage, CheckManage;
  // Materialize (T26, its record written first); Clean; RunDoctor;
  // GetAuthStatus; containers (Build and Prune as streaming custom
  // methods, Scaffold, Check).
}

// (-- region shared --)

// (-- `EnvVars` (the caller's environment, S7) and `Globals` (the global flags)
// are needs.proto's, beside the other request plumbing, so library.proto
// can carry them without importing this file. --)

// (-- endregion --)

// (-- region daemon --)

// `daemon status`.
message GetDaemonRequest {
  // `daemon`.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Daemon"];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
}

// A run the daemon hosts.
message HostedRun {
  // What kind of run it is.
  enum Kind {
    // Unset (proto3's zero value).
    KIND_UNSPECIFIED = 0;
    // An interactive session, its TUI on the user's terminal.
    TERMINAL = 1;
    // A one-shot (`run --one-shot`), hosted as the engine's turn command.
    ONE_SHOT = 2;
    // A long-lived child session, hosted by the daemon.
    CHILD = 3;
  }

  // `projects/{project}/sessions/{session}`.
  string session = 1;
  // The session's harp.
  string harp = 2;
  // `projects/{project}/runs/{run}`.
  string run = 3;
  // What kind of run it is.
  Kind kind = 4;
}

// The daemon (a singleton). Never its bearer.
message Daemon {
  option (google.api.resource) = {
    type: "ctxloom.dev/Daemon"
    pattern: "daemon"
    singular: "daemon"
    plural: "daemons"
  };

  // `daemon`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The daemon's process id.
  uint32 pid = 2;
  // The URL it listens on (TLS only).
  string endpoint = 3;
  // When it started.
  google.protobuf.Timestamp start_time = 4;
  // Its versionator stamp.
  string version = 5;
  // The runs it hosts now.
  repeated HostedRun runs = 6;
  // How many clients it serves; not counted yet, so 0.
  uint32 clients = 7;
  // How long it has hosted nothing, in seconds.
  uint64 idle_seconds = 8;
  // How long it stays up hosting nothing before it exits, in seconds.
  uint64 idle_limit_seconds = 9;
  // Field 10 was `draining_for`, the stamp of the version a drain handed
  // over to (gone with the version-to-version hand-over, OD-62).
  reserved 10;
  reserved "draining_for";
  // What the person must be told of this daemon (owner ruling OD-52): its
  // start-up catch-up or sweep failed, so what it answers may be missing
  // events. Each a notice in its crate's code and args
  // (`daemon-api-start-up-incomplete`); cleared once a later catch-up, which
  // the daemon tries again each round, succeeds. Empty while it is whole.
  repeated Notice warnings = 11;
  // Once it was asked to drain (`daemon stop --drain`, `ctxloom shutdown`,
  // a SIGTERM; OD-54): it takes no new call and exits once it hosts nothing.
  bool draining = 12;
}

// `daemon stop [--even-if-live] [--drain]`, `ctxloom shutdown [<duration>]`.
message StopDaemonRequest {
  // `daemon`: the singleton; the daemon reads no other, so it may be left
  // empty.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];
  // Stop even while it hosts live runs (`--even-if-live`): it ends each
  // hosted engine cleanly first (S12).
  bool even_if_live = 2 [(google.api.field_behavior) = OPTIONAL];
  // Drain (OD-54; `daemon stop --drain`, `ctxloom shutdown`). It is never
  // refused for what the daemon hosts: one-shots finish their turn, each
  // child is ended once it has no turn in flight, its hand-off kept, and the
  // next daemon re-hosts it (cause `drain`). `even_if_live` wins over it.
  // No client asks it for a version skew (OD-62).
  bool drain = 3 [(google.api.field_behavior) = OPTIONAL];
  // Field 4 was `version`, the stamp a drain handed over to (gone with the
  // version-to-version hand-over, OD-62).
  reserved 4;
  reserved "version";
  // How long the drain waits for what it hosts before it stops what remains
  // (owner, 2026-11-15: `ctxloom shutdown <duration>`); unset, the daemon's
  // `daemon.drain_timeout`, read again at each round, else five minutes.
  optional uint64 drain_timeout_seconds = 5 [(google.api.field_behavior) = OPTIONAL];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
}

// (-- endregion --)

// (-- region projects --)

// Register-or-recheck (owner, 2026-11-12, project registration): every
// daemon client calls it first, with what IT resolved of its working
// directory (S6): the project id (taskloom's project-registry identity, so a
// worktree is its primary checkout's project), the root, the repository's
// git common directory and its root commit (`git rev-list --max-parents=0
// HEAD`; of several, the lexically least). The first call names the project
// (its harp minted, S54) and records the rest in the `projects` aggregate;
// every later one recomputes and compares: a changed root commit is refused
// `ctxloom.sessions.v1.ProjectIdentityMismatch`, a `name` that is not the
// registered project's `ProjectHarpMismatch`, each naming the registered
// project. Outside git the two VCS fields are empty (an empty identity).
message ResolveProjectRequest {
  // `projects/{project}` the client expects (its session's), or empty.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];
  // The client's working directory, named in the refusal of one in no
  // project.
  string cwd = 2 [(google.api.field_behavior) = OPTIONAL];
  // The project id the client resolved (taskloom's project-registry
  // identity); empty, the directory is in no project, refused
  // `ProjectUnknown`.
  string project_id = 3 [(google.api.field_behavior) = REQUIRED];
  // The project's root directory.
  string root = 4 [(google.api.field_behavior) = OPTIONAL];
  // The repository's git common directory; empty outside git.
  string git_common_dir = 5 [(google.api.field_behavior) = OPTIONAL];
  // The repository's root commit (of several, the lexically least); empty
  // outside git. A change from the registered one is refused
  // `ProjectIdentityMismatch`.
  string root_commit = 6 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
}

// A project: a directory tree ctxloom works in, registered once and named by
// its harp.
message Project {
  option (google.api.resource) = {
    type: "ctxloom.dev/Project"
    pattern: "projects/{project}"
    singular: "project"
    plural: "projects"
  };

  // `projects/{project}`, the project's permanent harp (S42).
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The root it was first registered from.
  string root = 2;
  // The project id (the store's, and a session's claim namespace).
  string uid = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its registered VCS identity (empty outside git).
  string git_common_dir = 4;
  // Its registered root commit (empty outside git).
  string root_commit = 5;
}

// A project by its resource name.
message GetProjectRequest {
  // The Project to read, by its resource name.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Project"];
}

// `init`: the preview asks `output.dir`; the apply writes the project's
// config and answers what to do next.
message InitProjectRequest {
  // The project (`projects/{project}`) the client resolved, or empty.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];
  // The directory to initialize.
  string cwd = 2 [(google.api.field_behavior) = REQUIRED];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // The etag of the preview this apply was planned against (AIP-154): a stale
  // one is refused `PlanStale`. Empty with `--yes`: the write is planned and
  // applied in one call.
  string etag = 91 [(google.api.field_behavior) = OPTIONAL];
  // The preview (AIP-163): what the write would do and the needs a person
  // must answer first, applying nothing.
  bool validate_only = 92 [(google.api.field_behavior) = OPTIONAL];
  // One answer to each need the preview asked (needs.proto); an apply that
  // leaves one unanswered is refused `NeedsUnanswered`.
  repeated Answer answers = 93 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
  // What the caller can present of a need: ask a person, or put a program on
  // their terminal.
  Presentable presentable = 95 [(google.api.field_behavior) = OPTIONAL];
  // The global flags (`--degraded`, `--no-companions`, `--config-set`) the
  // call is planned under.
  Globals globals = 96 [(google.api.field_behavior) = OPTIONAL];
}

// What a client does next, decided by the daemon (API Q7).
message Continuation {
  // Start this on the terminal (the setup session), and wait for it.
  Launch launch = 1;
  // Then preview this.
  InitProjectRequest next = 2;
}

// What `init` wrote, and what the client does next.
message InitProjectResponse {
  // Each file written.
  repeated string written = 1;
  // What the client does next: the setup session's launch, then the restart
  // offer's preview.
  Continuation then = 2;
  // On a preview, the needs a person must answer before the apply
  // (needs.proto); empty once applied.
  repeated Need needs = 90;
  // On a preview, the etag of what it was planned against, for the apply to
  // send back (AIP-154).
  string etag = 91;
  // What is said beside the result, each notice its code, args and text.
  repeated Notice notices = 92;
}

// `context assemble`: the context a run would get.
message AssembleContextRequest {
  // The project, `projects/{project}`: assembled at its registered root.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // The agent whose profiles to compose; empty, the default agent.
  string agent = 2 [(google.api.field_behavior) = OPTIONAL];
  // The profiles to compose instead of the agent's.
  repeated string profiles = 3 [(google.api.field_behavior) = OPTIONAL];
  // The fragments to load by name (slice 3 step 6, S46's
  // `context_assemble`, whose `bundles` argument they are: the names a
  // premise index lists); an assembly that names only fragments and tags
  // takes no default profile.
  repeated string fragments = 4 [(google.api.field_behavior) = OPTIONAL];
  // The tags whose fragments to load.
  repeated string tags = 5 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
  // The global flags (`--degraded`, `--no-companions`, `--config-set`) the
  // call is planned under.
  Globals globals = 96 [(google.api.field_behavior) = OPTIONAL];
  // The caller's working directory (E1, owner 2026-11-17): the daemon
  // resolves the project and its checkout from it (a git worktree is a
  // checkout of its own, L2); empty, the project's registered root.
  string cwd = 97 [(google.api.field_behavior) = OPTIONAL];
}

// One fragment as the assembly used it.
message AssembledFragment {
  // `projects/{project}/bundles/{bundle}/fragments/{fragment}`.
  string fragment = 1;
  // The form a fragment was used in (AIP-126: nested in its one owner, its
  // values unprefixed).
  enum Form {
    // Unset (proto3's zero value); never answered.
    FORM_UNSPECIFIED = 0;
    // Its original content.
    ORIGINAL = 1;
    // Its distilled form (its digest matched).
    DISTILLED = 2;
  }
  // The form it was used in.
  Form form = 2;
}

// An assembled context, and what it was composed from.
message AssembledContext {
  // The context's text. It does NOT end with the premise index (E2, owner
  // 2026-11-17: how to view is presentation): what a premise held back is
  // `premised`, data, and the caller renders the index (the CLI's `context
  // assemble` at rest, the MCP server's `context_assemble` tool for a
  // launch), appending it after a section separator.
  string context = 1;
  // The token estimate of `context` as answered (the index not included):
  // a count, so uint32 (OQ-12; drafted uint64, which proto3 JSON prints as
  // a string).
  uint32 tokens = 2;
  // Each fragment the context used, and the form it used.
  repeated AssembledFragment fragments = 3;
  // The profiles composed, each a Profile's name (design §5.9).
  repeated string profiles = 4;
  // Each fragment asked for by name that did not load, as it was asked:
  // it names nothing, so it keeps its text (OQ-16).
  repeated string missing_fragments = 5;
  // The tags asked for, when none of them matched a fragment.
  repeated string missing_tags = 6;
  // The premise index as data (E2, `config.premised: on-demand`): each
  // fragment a premise held back, by the reference its ask named, with its
  // premise; sorted, each once. Empty under `always`, or when nothing was
  // held back.
  repeated PremiseEntry premised = 7;
  // `stale-distilled` for each distilled form whose digest did not match.
  repeated Notice notices = 92;
}

// (-- endregion --)

// (-- region sessions --)

// A message sent to a session and not yet delivered.
message PendingMessage {
  // The message's id.
  string message_id = 1;
  // `inform`, `wake` or `steer`, as `session send` said it.
  string urgency = 2;
  // The message's text.
  string text = 3;
  // A sender session's resource name; absent, the user.
  string sender = 4;
}

// A session (the session index's record).
message Session {
  option (google.api.resource) = {
    type: "ctxloom.dev/Session"
    pattern: "projects/{project}/sessions/{session}"
    singular: "session"
    plural: "sessions"
  };

  // A session's state: its lock's verdict, never its end stamp.
  enum State {
    // Unset; in a request's filter, any state.
    STATE_UNSPECIFIED = 0;
    // Its lock is held: a run of it is live.
    LIVE = 1;
    // Its lock proves it ended.
    ENDED = 2;
    // Its lock proves neither.
    UNKNOWN = 3;
  }

  // `projects/{project}/sessions/{session}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The stream root (UUID text), what a command's cover names.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Live, ended or unknown, by its lock.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The engine it runs on.
  string engine = 4;
  // The first prompt of its transcript, as its title would be without one
  // set.
  string summary = 5;
  // When it was minted.
  google.protobuf.Timestamp start_time = 6;
  // When its last run ended; unset while it is live.
  google.protobuf.Timestamp end_time = 7;
  // It is marked keep (`session keep`): no sweep or removal takes it.
  bool kept = 8;
  // The owner session's resource name.
  string owner = 9;
  // A child that was closed (`session close`).
  bool closed = 10;
  // Its children's resource names.
  repeated string children = 11;
  // `GetSession` only: the messages sent to it and not yet delivered.
  repeated PendingMessage pending = 12;
  // Its current incarnation: how many runs it has had.
  uint32 incarnation = 13;
  // The session's etag (AIP-154); not filled yet.
  string etag = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The free-text title `session rename` sets (S42); the harp never changes.
  string title = 15;
  // The engine's own session id, once bound.
  string native_session = 16;
  // The session's project directory.
  string project_root = 17;
  // Where its outputs go (`<project>/<output.dir>/<harp>`).
  string output_dir = 18;
  // Each engine session it was bound to before its native one (a /clear).
  repeated SessionRotation rotations = 19;
}

// A native session a session was bound to before (its binding rotated).
message SessionRotation {
  // The engine's session id it was bound to.
  string native_id = 1;
  // That native session's transcript file.
  string transcript_path = 2;
  // When the binding moved on.
  google.protobuf.Timestamp rotated_at = 3;
}

// `session show <harp>`.
message GetSessionRequest {
  // The Session to read, `projects/{project}/sessions/{session}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Session"];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
}

// `session list [--all] [--state]`, and `session transcript list`
// (`has_transcript`).
message ListSessionsRequest {
  // `projects/{project}`, or `projects/-` for every project.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Session"];
  // Only sessions in this state; unspecified, any.
  Session.State state = 2 [(google.api.field_behavior) = OPTIONAL];
  // Only sessions whose hooks have delivered a transcript.
  bool has_transcript = 3 [(google.api.field_behavior) = OPTIONAL];
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
}

// The sessions found, most recently started first.
message ListSessionsResponse {
  // The Session resources of this page.
  repeated Session sessions = 1;
  // The token of the next page (AIP-158); empty on the last. Every page is
  // the whole list today, so it is always empty.
  string next_page_token = 80;
}

// `session search <words>`.
message SearchSessionsRequest {
  // `projects/{project}`, or `projects/-` for every project.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // The words each session's harp or title must all hold, case-insensitively;
  // none, every session.
  repeated string words = 2 [(google.api.field_behavior) = OPTIONAL];
  // Only sessions in this state; unspecified, any.
  Session.State state = 3 [(google.api.field_behavior) = OPTIONAL];
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
}

// `session remove <harp> [--even-if-live] [--yes]`.
message DeleteSessionRequest {
  // One session (`session remove <harp>`); the age form is `SweepSessions`.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Session"];
  // Destroy a session whose lock does not prove it ended (`--even-if-live`):
  // the daemon judges by the session's lock. It reaches no worktree.
  bool even_if_live = 2 [(google.api.field_behavior) = OPTIONAL];
  // The client's id for this removal (AIP-155), sent again unchanged on the
  // one retry: a retry of a removal that already applied is answered its
  // first plan.
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // The etag of the preview this apply was planned against (AIP-154): a stale
  // one is refused `PlanStale`. Empty with `--yes`: the write is planned and
  // applied in one call.
  string etag = 91 [(google.api.field_behavior) = OPTIONAL];
  // The preview (`session remove` without `--yes`): the plan, applied
  // nowhere.
  bool validate_only = 92 [(google.api.field_behavior) = OPTIONAL];
  // One answer to each need the preview asked (needs.proto); an apply that
  // leaves one unanswered is refused `NeedsUnanswered`.
  // (-- api-linter: core::0135::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a write's answers to the needs its preview asked are ctxloom's (S38, API Q2). --)
  repeated Answer answers = 93 [(google.api.field_behavior) = OPTIONAL];
  // The caller's environment (S7): git runs in it for the worktrees.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
  // What the caller can present of a need: ask a person, or put a program on
  // their terminal.
  Presentable presentable = 95 [(google.api.field_behavior) = OPTIONAL];
}

// One file a removal destroys.
message RemovalFile {
  // What a file of a session's directory is to a removal: both classes are
  // destroyed, and the plan names which is which.
  enum Class {
    // Unset (proto3's zero value); never answered.
    CLASS_UNSPECIFIED = 0;
    // The machine-written conversation (`transcripts/`, `native/`).
    MACHINE = 1;
    // Anything else: a person wrote it, and it goes with the session.
    AUTHORED = 2;
  }

  // Its absolute path.
  string path = 1;
  // Relative to the session's directory.
  string rel = 2;
  // Whether a machine or a person wrote it.
  Class class = 3;
  // Its size in bytes.
  uint64 bytes = 4;
}

// One scratch worktree a removal or a sweep reached (`session worktrees`'s
// row): its owner by the session's lock, and its verdict.
message ScratchWorktree {
  // The session's harp.
  string harp = 1;
  // The worktree's name in its session (its directory's: the agent it is
  // for).
  string worktree = 2;
  // Its directory.
  string path = 3;
  // `alive`, `dead` or `indeterminate`.
  string owner_state = 4;
  // `reapable`, `reaped`, `spared` or `skipped`.
  string verdict = 5;
  // Why it got its verdict.
  string reason = 6;
}

// A session's scratch worktrees, classified, and with an apply removed.
message WorktreeReport {
  // Each scratch worktree, and its verdict.
  repeated ScratchWorktree worktrees = 1;
  // How many were removed.
  uint64 reaped = 2;
  // How many were left for the work in them.
  uint64 spared = 3;
  // How many were left because their owner was not proven ended.
  uint64 skipped = 4;
  // Whether the removal was applied; presence (OQ-7), so a plan says false.
  optional bool applied = 5;
}

// What `session remove` did, or would do: the session's whole file plan.
message DeleteSessionResponse {
  // The Session, `projects/{project}/sessions/{session}`.
  string name = 1;
  // The files a person wrote that the removal destroys (the notice).
  repeated string authored = 2;
  // The session's harp.
  string harp = 3;
  // Whether the session was destroyed (false: the plan, or refused);
  // presence (OQ-7), so a plan says false rather than leaving it out.
  optional bool applied = 4;
  // Every file of the session's directory, destroyed with it.
  repeated RemovalFile files = 5;
  // The bytes freed: zero on a plan.
  uint64 bytes_freed = 6;
  // How many events of it and of its runs went from the store.
  uint64 events_destroyed = 7;
  // Its scratch worktrees, when it has any.
  WorktreeReport worktrees = 8;
  // On a preview, the needs a person must answer before the apply
  // (needs.proto); empty once applied.
  repeated Need needs = 90;
  // On a preview, the etag of what it was planned against, for the apply to
  // send back (AIP-154).
  string etag = 91;
  // What is said beside the result, each notice its code, args and text.
  repeated Notice notices = 92;
}

// `session sweep [--purge-older-than] [--yes]`.
message SweepSessionsRequest {
  // `projects/{project}`, or `projects/-` for every project's sessions.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // `--purge-older-than`: an age (`90d`) or a date; none, the configured
  // `session_purge_age` of `project`.
  string older_than = 2 [(google.api.field_behavior) = OPTIONAL];
  // The caller's project (`projects/{project}`): whose configuration (read
  // from its registered root) gives the purge age.
  string project = 3 [(google.api.field_behavior) = OPTIONAL];
  // The client's id for this sweep (AIP-155), sent again unchanged on the one
  // retry: a retry of a sweep that already applied is answered its first
  // report.
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // The etag of the preview this apply was planned against (AIP-154): a stale
  // one is refused `PlanStale`. Empty with `--yes`: the write is planned and
  // applied in one call.
  string etag = 91 [(google.api.field_behavior) = OPTIONAL];
  // The report alone (`session sweep` without `--yes`).
  bool validate_only = 92 [(google.api.field_behavior) = OPTIONAL];
  // One answer to each need the preview asked (needs.proto); an apply that
  // leaves one unanswered is refused `NeedsUnanswered`.
  repeated Answer answers = 93 [(google.api.field_behavior) = OPTIONAL];
  // The caller's whole environment (S7), held in memory for the call's life.
  EnvVars env = 94 [(google.api.field_behavior) = OPTIONAL];
  // What the caller can present of a need: ask a person, or put a program on
  // their terminal.
  Presentable presentable = 95 [(google.api.field_behavior) = OPTIONAL];
}

// One row of a sweep: a session's fate, or one of its scratch worktrees'.
message SweepRow {
  // The session's harp.
  string harp = 1;
  // `skip`, `keep`, `spare`, `purge` or `worktree`.
  string action = 2;
  // `done`, `planned`, `held`, `left`, `skipped` or `failed`.
  string verdict = 3;
  // Why the row has its verdict.
  string reason = 4;
  // The command that does what the row could not, or will.
  string command = 5;
  // The bytes it frees (or would).
  uint64 bytes = 6;
  // The files a person wrote that the row's destroy takes.
  repeated string authored = 7;
}

// How many rows of each verdict.
message SweepCounts {
  // Rows applied.
  uint64 done = 1;
  // Rows planned, not applied (the report alone).
  uint64 planned = 2;
  // Rows held back: a kept session, no purge age set, or a worktree spared
  // for its work.
  uint64 held = 3;
  // Sessions left as they are: active after the purge age, or spared for a
  // worktree's work.
  uint64 left = 4;
  // Rows passed over: a session running or not proven ended, or a worktree
  // whose owner is not proven ended.
  uint64 skipped = 5;
  // Rows that failed.
  uint64 failed = 6;
}

// What `session sweep` did, or would do.
message SweepSessionsResponse {
  // Each removal the sweep planned or applied, its file plan whole.
  repeated DeleteSessionResponse sessions = 1;
  // Each session's fate, and each of its scratch worktrees'.
  repeated SweepRow rows = 2;
  // When purging begins, as a date; empty when purges are held.
  string purge_cutoff = 3;
  // How many rows of each verdict.
  SweepCounts counts = 4;
  // On a preview, the needs a person must answer before the apply
  // (needs.proto); empty once applied.
  repeated Need needs = 90;
  // On a preview, the etag of what it was planned against, for the apply to
  // send back (AIP-154).
  string etag = 91;
  // What is said beside the result, each notice its code, args and text.
  repeated Notice notices = 92;
}

// `session transcript show <harp>`.
message GetTranscriptRequest {
