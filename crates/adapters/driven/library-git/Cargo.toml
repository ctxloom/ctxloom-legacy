[package]
name = "library-git"
version = "0.1.0"
description = "The TreeObserver port over the git command line (step 10, U12): what git sees of a library tree, read without writing to its repository"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
ctxloom-ports.workspace = true
file-system.workspace = true
git-cli.workspace = true
os.workspace = true
process-env.workspace = true

[dev-dependencies]
fixture-program.workspace = true
file-system = { workspace = true, features = ["test-support"] }
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }
run-within = { workspace = true, features = ["test-support"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
